    <script>
      ;(() => {
        try {
          const themeKey = 'pipi.theme.v1'
          const fontKey = 'pipi.font.v1'
          const storedTheme = localStorage.getItem(themeKey)
          const storedFont = localStorage.getItem(fontKey)
          const theme = storedTheme === 'dark' ? 'dark' : 'light'
          const font = ['normal', 'large', 'xlarge'].includes(storedFont) ? storedFont : 'normal'
          const root = document.documentElement
          root.dataset.theme = theme
          root.dataset.font = font
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', theme === 'dark' ? '#121E27' : '#FFF8E7')
        } catch {
          // Tetap gunakan tema terang bila localStorage tidak tersedia.
        }
      })()
    </script>
